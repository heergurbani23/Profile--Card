
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Font Awesome CDN Link -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

    <style>
        .con{
            height: 600px;
            /* border: 1px solid black; */
        }
        .box{
            height: 80%;
            display: flex;
            width: 80%;
            /* border: 1px solid black; */
            margin: auto;
            margin-top: 60px;
            border-radius: 20px;
            box-shadow: 10px 10px 10px;           
        }
        .left,.center,.right{
            height: 100%;
            /* border: 1px solid black; */
        }
        .left{
            width: 2%;
            background-color: navy;
            border-radius: 20px;
        }
        .center{
            color: navy;
            width: 63%;
            font-size: 60px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: whitesmoke;
        }
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .center>h1{
            margin-left: 10px;
        }
        .right{
            width: 35%;
            border-radius: 20px;
            border-left: 1px solid grey;
        }
        .top{
            height: 35%;
            /* border: 1px solid black; */
        }
        .bottom{
            height: 65%;
            /* border: 1px solid black; */
        }
        .top-in{
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            height: 90%;
            /* border: 1px solid black; */
            background-color: navy;
        }
        .circle{
            height: 140px;
            width: 140px;
            border: 3px solid navy;
            border-radius: 50%;
            position: absolute;
            top:88px;
            right: 260px;
        }
        img{
            height: 100%;
            width: 100%;
            border-radius: 50%;
            border: 2px solid white;
        }
        h2{
            text-align: center;
        }
        .icon{
            height: 20%;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
        }
        .button{
            height: 20%;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }
        .b{
            color: white;
            height: 50%;
            width: 40%;
            background-color: navy;
            border-radius: 20px;
            text-align: center;
            line-height: 30px;
        }
        .fa-facebook{
            color: blue;
        }
        .fa-instagram{
            background: linear-gradient(red,orange);
            color: transparent;
            background-clip: text;
        }
        .fa-linkedin{
            color: lightskyblue;
        }
        .fa-github{
            color: violet;
        }
        .fa-behance{
            color: green;
        }
        .fa-heart{
            color: red;
        }
        .fa-share{
            color: blue;
        }
    </style>
</head>
<body>
    <div class="con">
        <div class="box">
            <div class="left"></div>
            <div class="center">
                <h1>Profile Card UI UX Design</h1>
            </div>
            <div class="right">
                <div class="top">
                    <div class="top-in">
                        <div class="circle">
                            <img src="capture.png" alt="">
                        </div>
                    </div>
                </div>
                <div class="bottom">
                    <h2>Web Designer</h2>
                    <h2>Dezyne Ecole College</h2>
                    <h2>BCA 1st Year</h2>
                    <div class="icon">
                        <i class="fa fa-brands fa-facebook fa-2x"></i>
                        <i class="fa fa-brands fa-instagram fa-2x"></i>
                        <i class="fa fa-brands fa-linkedin fa-2x"></i>
                        <i class="fa fa-brands fa-github fa-2x"></i>
                        <i class="fa fa-brands fa-behance fa-2x"></i>
                    </div>
                    <div class="button">
                        <div class="b">
                            Subscribe
                        </div>
                        <div class="b">
                            Message
                        </div>
                    </div>
                    <div class="icon">
                        <i class="fa fa-solid fa-heart fa-2x"></i>60K
                        <i class="fa fa-solid fa-comment fa-2x"></i>20K
                        <i class="fa fa-solid fa-share fa-flip-horizontal fa-2x"></i>12.4K
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
